[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-verfahrensbeschreibungen"
version = "0.1.0"
description = "RAG-System über Verfahrensbeschreibungen von Feinstzerkleinerern"
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11", "numpy>=1.26", "scikit-learn>=1.4"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
embeddings = ["sentence-transformers>=3.0"]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8"]

[project.scripts]
rag = "rag.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
